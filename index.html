<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitwards</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div class="hero-content">
        <span class="eyebrow">Download the App</span>
        <h1>Bitwards</h1>
        <p>Secure passwords, manage credentials, and access your digital life with one tap. Available on mobile devices.</p>
        <div class="store-links">
          <a class="store-button google" href="https://play.google.com/store/apps/details?id=fi.bitwards.bitwardskeyapp" target="_blank" rel="noopener noreferrer">
            <img src="google-play-badge.svg" alt="Get it on Google Play" />
          </a>
          <a class="store-button apple" href="https://apps.apple.com/us/iphone/search?term=bitwards" target="_blank" rel="noopener noreferrer">
            <img src="app-store-badge.svg" alt="Download on the App Store" />
          </a>
        </div>
      </div>
      <div class="hero-visual">
        <div class="phone-mockup">
          <div class="phone-screen">
            <p>Coming soon to your device.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
